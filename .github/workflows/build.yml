name: build-windows-exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install minecraft-launcher-lib pyinstaller pillow

      # --noupx : le packing UPX est LE signal malware #1 → jamais.
      # --icon + --version-file : exe identifiable = beaucoup moins de faux positifs.
      - name: Build HarborLauncher.exe
        working-directory: harbor
        run: pyinstaller --onefile --noconsole --noupx --clean --name HarborLauncher --icon assets/harbor.ico --version-file version.txt --add-data "harbor.jar;." --add-data "assets;assets" launcher.py

      - name: Build DonShotLauncher.exe
        working-directory: donshot
        run: pyinstaller --onefile --noconsole --noupx --clean --name DonShotLauncher --icon assets/donshot.ico --version-file version.txt --add-data "donshot.jar;." --add-data "assets;assets" launcher.py

      - name: Build StudioEchelonClient.exe
        working-directory: client
        run: pyinstaller --onefile --noconsole --noupx --clean --name StudioEchelonClient --icon assets/studio_icon.ico --version-file ../version_client.txt --add-data "assets;assets" launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: StudioEchelonClient
          path: client/dist/StudioEchelonClient.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HarborLauncher
          path: harbor/dist/HarborLauncher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DonShotLauncher
          path: donshot/dist/DonShotLauncher.exe
